# Los valores ${...} se rellenan desde gradle.properties al compilar (tarea processResources).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Igneko/TACZ-vortech-embers-glory-kills-/issues"

[[mods]]
# Debe coincidir con el @Mod de GloryKillsMod.java
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# Dependencia obligatoria de Forge
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

# Dependencia obligatoria de Minecraft
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Dependencia obligatoria de TACZ (Timeless and Classics Zero)
[[dependencies.${mod_id}]]
    modId="tacz"
    mandatory=true
    versionRange="[1.1.0,)"
    ordering="AFTER"
    side="BOTH"
